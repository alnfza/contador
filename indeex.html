<!DOCTYPE html>
<html>

<head>
    <title>Meu Contador Personalizado</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;

        }

        body {
            min-height: 100vh;
            background: #444;
            color: black;
            display: grid;
            place-items: center;
        }

        section {
            background: rgba(255, 255, 255, 0.8);
            padding: 60px;
            border-radius: 10px;
            text-align: center;
            border: 10px solid red;

        }
       
        p {
            font-size: 110px
        }
    </style> 
</head>

<body>
    <section>
        <h1>Meu Contador</h1>  
        <p>0</p>
        <button onclick="aumentar()">+</button>
        <button onclick="diminuir()">-</button>
    </section>
    <script>

        // estado da minha aplicação
        let numero = 0;

        //alteradores de estados da aplicação
        function aumentar() {
            numero++
            mostrarNaTela();
        }

        function diminuir() {
            numero--;
            mostrarNaTela();
        }

        //jogar o estado da aplicação na tela
        function mostrarNaTela() {
            const p = document.querySelector("p");
            p.innerText = numero;
        }
    </script>
</body>
</html>
